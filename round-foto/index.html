<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Round Foto — Alphools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/" aria-label="Kembali ke Alphools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="topbar-brand">
    <div class="topbar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="8"/></svg>
    </div>
    ROUND FOTO
  </div>
</div>

<div class="hint-bar">
  <span class="hint-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
  </span>
  <span>Pilih foto · atur radius sudut · unduh hasilnya</span>
</div>

<div class="content">

  <!-- Dropzone: shown before a photo is chosen -->
  <div class="dropzone" id="dropzone">
    <div class="dropzone-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
    </div>
    <div class="dropzone-title">Ketuk untuk pilih foto</div>
    <div class="dropzone-sub">atau tarik & lepas di sini</div>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <!-- Editor: shown after a photo is chosen -->
  <div class="editor" id="editor" hidden>

    <div class="prop-block">
      <div class="prop-row">
        <label>Radius</label>
        <div class="slider-control">
          <input type="range" id="radiusSlider" min="0" max="100" step="1" value="20">
          <div class="stepper">
            <button type="button" class="step-btn" data-for="radiusSlider" data-step="-1">−</button>
            <span class="step-value" id="radiusVal">20</span>
            <button type="button" class="step-btn" data-for="radiusSlider" data-step="1">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="prop-block">
      <div class="section-label">Latar Belakang</div>
      <div class="section-label-row">Warna yang muncul di area sudut yang terpotong</div>
      <div class="swatches" id="bgSwatches">
        <button type="button" class="swatch" data-color="#EFE9DD" style="background:#EFE9DD"></button>
        <button type="button" class="swatch" data-color="#1C1D22" style="background:#1C1D22"></button>
        <button type="button" class="swatch" data-color="#E4D9C4" style="background:#E4D9C4"></button>
        <button type="button" class="swatch active" data-color="transparent">
          <span class="checker"></span>
        </button>
        <button type="button" class="swatch" data-color="#10B981" style="background:#10B981"></button>
        <button type="button" class="swatch" data-color="#E15B4D" style="background:#E15B4D"></button>
        <label class="swatch custom" for="customColor">
          <span class="rainbow"></span>
          <input type="color" id="customColor" value="#10B981">
        </label>
      </div>
    </div>

    <div class="preview-wrap">
      <div class="preview-label">PREVIEW</div>
      <div class="stage-outer">
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <button class="ghost-btn" id="changePhotoBtn">Ganti Foto</button>
    <button class="btn-download-main" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      Unduh Foto
    </button>
  </div>

</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg">Foto berhasil diunduh</span>
</div>

<script src="script.js"></script>
</body>
</html>
