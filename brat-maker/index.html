<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Brat Maker — Alphools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Archivo+Narrow:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="/" aria-label="Kembali ke Alphools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="topbar-brand">
    <div class="topbar-icon">B</div>
    BRAT MAKER
  </div>
</div>

<div class="hint-bar">
  <span class="hint-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
  </span>
  <span>Tulis teks · atur gaya · unduh</span>
</div>

<div class="content">

  <div class="prop-block">
    <div class="section-label">Teks</div>
    <textarea id="textInput" placeholder="tulis apa aja di sini..." maxlength="200" rows="3"></textarea>
  </div>

  <div class="prop-block">
    <div class="section-label">Gaya</div>
    <div class="toggle-row">
      <button type="button" class="toggle-chip" id="darkToggle">
        <span class="chip-dot dot-dark"></span> Dark
      </button>
      <button type="button" class="toggle-chip" id="hdToggle">
        <span class="chip-dot dot-hd"></span> HD (tajam)
      </button>
      <button type="button" class="toggle-chip" id="nobgToggle">
        <span class="chip-dot dot-nobg"></span> Transparan
      </button>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="preview-label">PREVIEW</div>
    <div class="stage-outer">
      <canvas id="canvas" width="512" height="512"></canvas>
      <div class="empty-hint" id="emptyHint">Ketikan teks di atas buat mulai</div>
    </div>
  </div>

  <div class="quota-note" id="quotaNote"></div>

  <button class="btn-download-main" id="downloadPngBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    Unduh PNG
  </button>
  <button class="ghost-btn" id="downloadWebpBtn">Unduh WebP (buat stiker WA)</button>

</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg">Berhasil diunduh</span>
</div>

<script src="script.js"></script>
</body>
</html>
